apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-uat
  labels:
    app: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: andressaffdiniz/nginx-test:1.0.5-release
          ports:
            - containerPort: 80
