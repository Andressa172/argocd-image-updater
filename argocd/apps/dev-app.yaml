apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-dev
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: nginx=andressa172/nginx
    argocd-image-updater.argoproj.io/nginx.update-strategy: latest
    argocd-image-updater.argoproj.io/nginx.allow-tags: regexp:^.*-release$
spec:
  project: default
  source:
    repoURL: 'https://github.com/Andressa172/argocd-image-updater'
    targetRevision: develop
    path: manifests/dev
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
