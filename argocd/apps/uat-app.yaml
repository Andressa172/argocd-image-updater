apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-uat
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/Andressa172/argocd-image-updater'
    targetRevision: HEAD
    path: manifests/uat
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: uat
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
